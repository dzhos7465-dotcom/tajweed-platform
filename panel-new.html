<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переход…</title>
<!--
  Панель переехала под обычное имя panel.html. Этот файл оставлен на случай
  сохранённой закладки: он просто переводит на неё.
-->
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #fdfbf4; color: #6b6355; display: flex;
         align-items: center; justify-content: center; height: 100vh;
         margin: 0; text-align: center; }
  a { color: #0f7d74; }
</style>
</head>
<body>
  <div>
    <p>Панель переехала.</p>
    <p><a id="manual" href="panel.html">Открыть панель</a></p>
  </div>
<script>
  (function () {
    var target = 'panel.html' + window.location.search + window.location.hash;
    var link = document.getElementById('manual');
    if (link) link.setAttribute('href', target);
    window.location.replace(target);
  })();
</script>
</body>
</html>
