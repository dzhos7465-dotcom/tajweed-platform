<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переход…</title>
<!--
  ЗАЧЕМ ЭТОТ ФАЙЛ.
  Пока шёл переезд на новую базу, экзамен жил по адресу exam-new.html, и
  ссылки на сессии раздавались именно такие. Теперь экзамен стоит под
  обычным именем exam.html, но ссылки у учеников в переписке остались
  прежние. Файл ничего не показывает — он переводит на новый адрес,
  СОХРАНЯЯ номер сессии. Без него старая ссылка открывала бы пустоту.

  Удалять его не нужно: он крохотный и страхует от забытой ссылки.
-->
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #fdfbf4; color: #6b6355; display: flex;
         align-items: center; justify-content: center; height: 100vh;
         margin: 0; text-align: center; }
  a { color: #0f7d74; }
</style>
</head>
<body>
  <div>
    <p>Открываем работу…</p>
    <p><a id="manual" href="exam.html">Если не открылось, нажмите сюда</a></p>
  </div>
<script>
  (function () {
    // переносим ВСЕ параметры как есть: там номер сессии
    var target = 'exam.html' + window.location.search + window.location.hash;
    var link = document.getElementById('manual');
    if (link) link.setAttribute('href', target);
    // replace, а не assign: кнопка «назад» не должна возвращать сюда же
    window.location.replace(target);
  })();
</script>
</body>
</html>
