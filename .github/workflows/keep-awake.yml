# ═══════════════════════════════════════════════════════════════════
#  «НЕ ЗАСЫПАЙ» — пробуждение базы
#  ═══════════════════════════════════════════════════════════════════
#  Supabase останавливает бесплатный проект после 7 дней без обращений,
#  и включать его приходится руками. Для платформы это значит: ушёл на
#  каникулы — вернулся к нерабочим ссылкам.
#
#  Этот файл заставляет GitHub раз в двое суток дёргать базу. Работает
#  сам, ничего включать не нужно, для GitHub это бесплатно.
#
#  Куда положить: в репозитории создать папку  .github/workflows
#  и внутри неё этот файл под именем  keep-awake.yml
# ═══════════════════════════════════════════════════════════════════
 
name: keep-awake
 
on:
  schedule:
    # каждые двое суток в 4 утра — с запасом до семидневного предела
    - cron: '0 4 */2 * *'
  workflow_dispatch:        # и кнопка «запустить сейчас» в разделе Actions
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить базу
        run: |
          URL="https://ullxrzxoscdpftbatltu.supabase.co/rest/v1/activities?select=id&limit=1"
          KEY="sb_publishable_qNR6uaRvK0lWwrhVHiIV4w_ru7WcUw9"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
                 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "Ответ базы: $code"
          # 200 — жива. Любой другой ответ считаем неудачей, чтобы GitHub
          # прислал письмо и мы узнали о простое раньше учеников.
          test "$code" = "200"
 
